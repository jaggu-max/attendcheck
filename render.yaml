services:
  # FastAPI Backend Service
  - type: web
    name: gmit-attendance-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: GOOGLE_DRIVE_FILE_ID
        sync: false
      - key: ALLOWED_SECTIONS
        value: 3A,3B,5A,5B,7A,7B
      - key: ATTENDANCE_CACHE_TTL_SECONDS
        value: "300"

  # Next.js Frontend Web Service
  - type: web
    name: gmit-attendance-frontend
    env: node
    rootDir: frontend
    buildCommand: yarn install && yarn build
    startCommand: yarn start
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NEXT_PUBLIC_BACKEND_URL
        sync: false
